<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colora">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf8ef">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Colora e Impara</title>
<style>
  :root{
    --bg:#fdf8ef; --ink:#2d2a32; --muted:#7a7480; --card:#ffffff;
    --accent:#ff7a59; --accent2:#4f8cff; --empty:#efeae2; --hi:#fff1a8;
    --cell:40px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
  input{-webkit-user-select:text;user-select:text}
  button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
  .screen{display:none;min-height:100%;padding:16px 16px 24px;flex-direction:column;align-items:center}
  .screen.on{display:flex}
  h1{font-size:clamp(28px,6vw,44px);margin:12px 0 4px;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  h2.q{font-size:clamp(24px,5vw,34px);margin:16px 0 8px;text-align:center}
  .sub{color:var(--muted);margin:0 0 20px;font-size:17px;text-align:center}
  .wrap{width:min(820px,100%)}
  /* banner giocatore */
  .banner{width:min(820px,100%);display:flex;align-items:center;gap:14px;border-radius:24px;padding:14px 18px;margin:6px 0 16px;
    background:linear-gradient(120deg,#ff9a76,#ffc36b);color:#fff;box-shadow:0 4px 0 #e8845a}
  .banner .av{font-size:46px;line-height:1;background:rgba(255,255,255,.3);border-radius:18px;width:66px;height:66px;display:flex;align-items:center;justify-content:center;flex:none}
  .banner .hello{flex:1;min-width:0}
  .banner .hello b{display:block;font-size:clamp(22px,4.6vw,32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.15)}
  .banner .hello small{font-size:15px;opacity:.95}
  .banner .chg{background:rgba(255,255,255,.95);color:#d0603c;font-weight:800;border-radius:14px;padding:10px 14px;font-size:15px;flex:none}
  .cont{width:min(820px,100%);display:flex;align-items:center;gap:14px;background:var(--accent2);color:#fff;border-radius:22px;padding:14px 18px;
    box-shadow:0 4px 0 #3a6fd1;margin-bottom:16px;text-align:left}
  .cont canvas{width:58px;height:58px;image-rendering:pixelated;background:#fff;border-radius:12px;padding:4px;flex:none}
  .cont b{font-size:21px;display:block}
  .cont small{font-size:15px;opacity:.9}
  .cont .go{margin-left:auto;font-size:34px}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;width:min(820px,100%)}
  .mode{background:var(--card);border-radius:22px;padding:18px 16px;text-align:left;
    box-shadow:0 3px 0 #e8dfd2;display:flex;flex-direction:column;gap:6px;transition:transform .1s}
  .mode:active,.cont:active,.player:active{transform:scale(.97)}
  .mode .ico{font-size:40px;line-height:1}
  .mode b{font-size:21px}
  .mode small{color:var(--muted);font-size:14px;line-height:1.3}
  /* chi gioca */
  .players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:min(820px,100%)}
  .player{background:var(--card);border-radius:22px;padding:18px 12px;box-shadow:0 3px 0 #e8dfd2;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
  .player .av{font-size:56px;line-height:1}
  .player b{font-size:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player small{color:var(--muted);font-size:14px}
  .player.add{border:3px dashed #e3dccf;box-shadow:none;background:transparent;justify-content:center}
  .player .del{position:absolute;top:6px;right:6px;background:#ffe3dd;color:#c0392b;border-radius:12px;padding:4px 9px;font-weight:800;font-size:14px}
  .player .del.sure{background:#e53935;color:#fff}
  .link{color:var(--muted);text-decoration:underline;margin-top:20px;font-size:15px;padding:8px}
  .form{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 3px 0 #e8dfd2;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;align-items:center}
  .form input{width:100%;font:inherit;font-size:28px;font-weight:800;text-align:center;padding:14px;border-radius:18px;border:3px solid #e3dccf;background:#fffdf9;color:var(--ink);outline:none}
  .form input:focus{border-color:var(--accent)}
  .avs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
  .avs button{font-size:40px;padding:8px 0;border-radius:16px;background:#f6f1e9;border:3px solid transparent}
  .avs button.sel{border-color:var(--accent);background:#fff1ea}
  .err{color:#c0392b;min-height:20px;font-weight:700}
  .bar{width:min(820px,100%);display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .back{width:48px;height:48px;border-radius:16px;background:var(--card);font-size:24px;box-shadow:0 3px 0 #e8dfd2;flex:none}
  .bar .t{font-size:22px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;box-shadow:0 3px 0 #e8dfd2;font-size:16px}
  .voice{width:48px;height:48px;border-radius:16px;background:var(--card);font-size:22px;box-shadow:0 3px 0 #e8dfd2;flex:none}
  .pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;width:min(820px,100%)}
  .pic{background:var(--card);border-radius:20px;padding:12px;box-shadow:0 3px 0 #e8dfd2;display:flex;flex-direction:column;align-items:center;gap:8px}
  .pic canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:10px}
  .pic span{font-weight:700}
  .pic .star{color:#f5b301}
  #grid{display:grid;gap:2px;background:#e3dccf;padding:2px;border-radius:14px;touch-action:none}
  .cell{width:var(--cell);height:var(--cell);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#6d6672;font-size:calc(var(--cell)*.36);line-height:1;transition:background .15s;position:relative;overflow:hidden}
  .cell.emo{font-size:calc(var(--cell)*.56)}
  .cell.bgc{background:var(--empty)}
  .cell.hi{background:var(--hi);color:var(--ink)}
  .cell.done{color:transparent}
  .cell.done.emo{font-size:0}
  .cell.bad{animation:bad .35s}
  @keyframes bad{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .cell.pop{animation:pop .25s}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
  .pal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px;width:min(820px,100%)}
  .sw{min-width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 4px 0 rgba(0,0,0,.15);
    border:4px solid transparent;transition:transform .1s;position:relative;padding:0 10px}
  .sw.sel{border-color:var(--ink);transform:translateY(-4px)}
  .sw.ok::after{content:"✓";position:absolute;top:-8px;right:-8px;background:#2fbf71;color:#fff;border-radius:50%;
    width:26px;height:26px;font-size:16px;display:flex;align-items:center;justify-content:center;text-shadow:none}
  .sw.light{color:#2d2a32;text-shadow:none}
  .hint{color:var(--muted);margin-top:10px;font-size:15px;text-align:center;min-height:20px}
  .win{position:fixed;inset:0;background:rgba(45,42,50,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
  .win.on{display:flex}
  .winbox{background:var(--card);border-radius:28px;padding:26px;text-align:center;max-width:420px;width:100%;animation:pop .3s}
  .winbox h2{font-size:34px;margin:6px 0}
  .winbox canvas{width:180px;height:180px;image-rendering:pixelated;margin:8px auto;display:block}
  .big{background:var(--accent);color:#fff;font-weight:800;font-size:20px;padding:14px 22px;border-radius:18px;box-shadow:0 4px 0 #d85f40;margin:6px}
  .big.alt{background:var(--accent2);box-shadow:0 4px 0 #3a6fd1}
  .conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:11;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .foot{margin-top:auto;padding-top:24px;color:var(--muted);font-size:13px;text-align:center}
  .levels{width:min(820px,100%);display:flex;gap:10px;margin-bottom:16px}
  .lv{flex:1;background:var(--card);border-radius:18px;padding:10px 6px;box-shadow:0 3px 0 #e8dfd2;border:3px solid transparent;text-align:center}
  .lv b{display:block;font-size:17px}
  .lv span{font-size:15px;letter-spacing:1px}
  .lv.sel{border-color:var(--accent);background:#fff1ea}
  .cell.l4{font-size:calc(var(--cell)*.30)}
  .cell.l5{font-size:calc(var(--cell)*.27)}
  .help{width:48px;height:48px;border-radius:16px;background:var(--card);font-size:22px;box-shadow:0 3px 0 #e8dfd2;flex:none}
  .pic small{color:var(--muted);font-size:12px;margin-top:-6px}
  .sect{width:min(820px,100%);font-size:20px;font-weight:800;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
  .sect.xmas{background:linear-gradient(120deg,#c62828,#2e7d32);color:#fff;border-radius:18px;padding:10px 16px;box-shadow:0 3px 0 #1b5e20}
  #view{position:relative;overflow:hidden;border-radius:14px;touch-action:none;max-width:100%}
  #grid{transform-origin:0 0;will-change:transform}
  .zoom{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .zoom button{width:46px;height:46px;border-radius:14px;background:var(--card);font-size:24px;font-weight:900;box-shadow:0 3px 0 #e8dfd2}
  .zoom span{color:var(--muted);font-size:14px}
</style>
</head>
<body>

<!-- CHI GIOCA? -->
<section class="screen" id="who">
  <h1>Colora <span>e</span> Impara</h1>
  <h2 class="q">Chi gioca oggi?</h2>
  <div class="players" id="players"></div>
  <button class="link" id="manageBtn">Gestisci giocatori</button>
</section>

<!-- NUOVO GIOCATORE -->
<section class="screen" id="newp">
  <div class="bar">
    <button class="back" id="newBack" aria-label="Indietro">←</button>
    <div class="t">Nuovo giocatore</div>
  </div>
  <div class="form">
    <h2 class="q" style="margin:0">Come ti chiami?</h2>
    <input id="nameIn" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Il tuo nome">
    <div style="font-weight:800;font-size:18px">Scegli il tuo amico</div>
    <div class="avs" id="avs"></div>
    <div class="err" id="nameErr"></div>
    <button class="big" id="createBtn">Iniziamo! 🎨</button>
  </div>
</section>

<!-- HOME -->
<section class="screen" id="home">
  <div class="banner">
    <div class="av" id="bAv"></div>
    <div class="hello"><b id="bName"></b><small id="bInfo"></small></div>
    <button class="chg" id="chgBtn">Cambia</button>
  </div>
  <div class="levels" id="levels"></div>
  <button class="cont" id="contBtn" style="display:none">
    <canvas id="contCv" width="12" height="12"></canvas>
    <div><b>Continua la partita</b><small id="contInfo"></small></div>
    <div class="go">▶️</div>
  </button>
  <div class="modes" id="modes"></div>
  <div class="foot">© 2026 Gennaro Russo · Funziona anche offline · nessuna pubblicità</div>
</section>

<!-- SCELTA DISEGNO -->
<section class="screen" id="pick">
  <div class="bar">
    <button class="back" data-go="home" aria-label="Indietro">←</button>
    <div class="t" id="pickTitle"></div>
  </div>
  <div class="pics" id="pics"></div>
</section>

<!-- GIOCO -->
<section class="screen" id="play">
  <div class="bar">
    <button class="back" id="playBack" aria-label="Indietro">←</button>
    <div class="t" id="playTitle"></div>
    <div class="pill" id="prog">0%</div>
    <button class="help" id="helpBtn" aria-label="Aiuto">💡</button>
    <button class="voice" id="voiceBtn" aria-label="Voce">🔊</button>
  </div>
  <div id="view">
    <div id="grid"></div>
  </div>
  <div class="zoom" id="zoomBox">
    <button id="zOut" aria-label="Rimpicciolisci">－</button>
    <button id="zFit" aria-label="Vedi tutto">⤢</button>
    <button id="zIn" aria-label="Ingrandisci">＋</button>
    <span>🔍 due dita per ingrandire e spostarti</span>
  </div>
  <div class="pal" id="pal"></div>
  <div class="hint" id="hint"></div>
</section>

<div class="win" id="win">
  <div class="winbox">
    <div style="font-size:54px">🎉</div>
    <h2 id="winTitle">Fantastico!</h2>
    <p style="color:var(--muted);margin:0">Hai finito il disegno: è nel tuo album!</p>
    <canvas id="winCanvas" width="12" height="12"></canvas>
    <div id="winStars" style="font-size:26px;color:#f5b301;margin-bottom:6px"></div>
    <button class="big" id="nextBtn">Un altro disegno</button>
    <button class="big alt" id="homeBtn">Cambia gioco</button>
  </div>
</div>

function isLight(hex){
  const n = parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  return (r*299+g*587+b*114)/1000 > 170;
}

  if(p){
    if(!p.stars){ p.stars = {}; (p.album||[]).forEach(id => p.stars[id] = 1); }

}

let voiceOn = store.get("cei-voice", true);
let itVoice = null;
function loadVoice(){ try{ const vs = speechSynthesis.getVoices(); itVoice = vs.find(v => /^it/i.test(v.lang)) || null; }catch(e){} }
try{ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }catch(e){}
function say(text){
  if(!voiceOn) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "it-IT"; if(itVoice) u.voice = itVoice; u.rate = 0.9; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
let actx = null;
function beep(freq, dur, type){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.08, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
const NUMWORD = ["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove","venti"];

/* ---------- Chiavi ed etichette ---------- */
const range = (a,b) => Array.from({length:b-a+1},(_,i)=>a+i);
function makeKeys(mode, k, lv){
  const numSort = a => a.sort((x,y)=>x-y);
  if(mode==="numeri") return lv===1 ? range(1,k) : numSort(shuffle(lv===2 ? range(1,10) : range(10,20)).slice(0,k));
  if(mode==="somme") return numSort(shuffle(lv===1 ? range(2,10) : lv===2 ? range(5,20) : range(6,20)).slice(0,k));
  if(mode==="sottrazioni") return numSort(shuffle(lv===1 ? range(1,9) : lv===2 ? range(1,12) : range(2,17)).slice(0,k));
  if(mode==="vocali") return shuffle(lv===1 ? ["A","E","I","O","U"] : lv===2 ? ALPHA : Object.keys(SYL)).slice(0,k).sort();
  return shuffle(Object.keys(lv===1 ? WORDS_V : lv===2 ? WORDS_C : SYL)).slice(0,k).sort();
}
function makeLabel(mode, key, lv){
  if(mode==="numeri") return {t:String(key), s:NUMWORD[key]};
  if(mode==="somme"){
    if(lv===3){
      let a,b,c; do{ a=1+rnd(9); b=1+rnd(9); c=key-a-b; }while(c<1||c>9);
      return {t:a+"+"+b+"+"+c, s:NUMWORD[a]+" più "+NUMWORD[b]+" più "+NUMWORD[c]};
    }
    let a,b; do{ a=1+rnd(key-1); b=key-a; }while(lv===2 && (a>10||b>10));
    return {t:a+"+"+b, s:NUMWORD[a]+" più "+NUMWORD[b]};
  }
  if(mode==="sottrazioni"){
    const max = lv===1 ? 10 : lv===2 ? 15 : 20;
    const b = 1+rnd(Math.min(max-key, lv===1 ? 9 : 10)), a = key+b;
    return {t:a+"−"+b, s:NUMWORD[a]+" meno "+NUMWORD[b]};
  }
  if(mode==="vocali"){ const t = Math.random()<.5 ? key : key.toLowerCase(); return {t:t, s:lv===3 ? key.toLowerCase() : key}; }
  const w = pick((lv===1 ? WORDS_V : lv===2 ? WORDS_C : SYL)[key]); return {t:w[0], s:w[1], e:1};
}

  window.scrollTo(0,0);
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));

/* --- Chi gioca --- */
let manage = false;
function renderWho(){
  const box = $("#players"); box.innerHTML = "";
  players.forEach(p => {
    const b = document.createElement("div"); b.className = "player"; b.setAttribute("role","button");
    const av = document.createElement("div"); av.className = "av"; av.textContent = p.avatar;
    const nm = document.createElement("b"); nm.textContent = p.name;
    const sm = document.createElement("small"); const nA = albumCount(p); sm.textContent = `⭐ ${nA} ${nA===1?"disegno":"disegni"}`;
    b.append(av, nm, sm);
    if(manage){
      const d = document.createElement("button"); d.className = "del"; d.textContent = "✕";
      d.onclick = ev => {
        ev.stopPropagation();
        if(!d.classList.contains("sure")){ d.classList.add("sure"); d.textContent = "Elimina?"; return; }
        players = players.filter(x => x.id!==p.id);
        if(current===p.id) current = null;
        savePlayers(); if(!players.length) manage = false; renderWho();
      };
      b.appendChild(d);
    }
    b.onclick = () => { if(manage) return; current = p.id; savePlayers(); say("Ciao " + p.name + "!"); show("home"); };
    box.appendChild(b);
  });
  const add = document.createElement("button"); add.className = "player add";
  add.innerHTML = `<div class="av">➕</div><b>Nuovo</b>`;
  add.onclick = () => openNew();
  box.appendChild(add);
  $("#manageBtn").style.display = players.length ? "" : "none";
  $("#manageBtn").textContent = manage ? "Fatto" : "Gestisci giocatori";
}
$("#manageBtn").onclick = () => { manage = !manage; renderWho(); };

/* --- Nuovo giocatore --- */
let chosenAv = AVATARS[0];
function openNew(){
  manage = false;
  $("#nameIn").value = ""; $("#nameErr").textContent = "";
  chosenAv = pick(AVATARS);
  const box = $("#avs"); box.innerHTML = "";
  AVATARS.forEach(a => {
    const b = document.createElement("button"); b.textContent = a;
    b.classList.toggle("sel", a===chosenAv);
    b.onclick = () => { chosenAv = a; [...box.children].forEach(c => c.classList.toggle("sel", c===b)); };
    box.appendChild(b);
  });
  $("#newBack").style.visibility = players.length ? "visible" : "hidden";
  show("newp");
  setTimeout(() => { try{ $("#nameIn").focus(); }catch(e){} }, 150);
}
$("#newBack").onclick = () => show("who");
function createPlayer(){
  const name = $("#nameIn").value.trim().replace(/\s+/g," ");
  if(!name){ $("#nameErr").textContent = "Scrivi un nome 🙂"; return; }
  if(players.some(p => p.name.toLowerCase()===name.toLowerCase())){ $("#nameErr").textContent = "Questo nome c'è già"; return; }
  const p = {id:"p"+Date.now().toString(36)+rnd(1e4), name, avatar:chosenAv, album:[], stars:{}, level:1, save:null, lastMode:null};
  if(oldAlbum && !players.length){ oldAlbum.forEach(id => p.stars[id] = 1); try{ localStorage.removeItem("cei-album"); }catch(e){} }
  players.push(p); current = p.id; savePlayers();
  try{ $("#nameIn").blur(); }catch(e){}
  say("Ciao " + name + "! Iniziamo a colorare!");
  show("home");
}
$("#createBtn").onclick = createPlayer;
$("#nameIn").addEventListener("keydown", e => { if(e.key==="Enter") createPlayer(); });

/* --- Home --- */
function renderHome(){
  const p = me(); if(!p){ show(players.length ? "who" : "newp"); return; }
  $("#bAv").textContent = p.avatar;
  $("#bName").textContent = "Ciao, " + p.name + "!";
  const nA = albumCount(p);
  $("#bInfo").textContent = nA ? `⭐ Album: ${nA} di ${IMAGES.length} disegni` : "Scegli un gioco e inizia a colorare";
  const lvBox = $("#levels"); lvBox.innerHTML = "";
  LEVELS.forEach((L,i) => {
    const b = document.createElement("button"); b.className = "lv" + (p.level===i+1 ? " sel" : "");
    b.innerHTML = `<b>${L.n}</b><span>${L.s}</span>`;
    b.onclick = () => { p.level = i+1; savePlayers(); say("Livello " + L.n); renderHome(); };
    lvBox.appendChild(b);
  });
  // ultima partita
  const s = p.save, cb = $("#contBtn");
  if(s && imgById(s.img) && modeById(s.mode)){
    const im = imgById(s.img), md = modeById(s.mode);
    const done = s.done.filter(Boolean).length, tot = s.labels.filter(Boolean).length;
    $("#contInfo").textContent = `${im.name} · ${md.ico} ${md.name} · ${LEVELS[(s.level||1)-1].s} · ${Math.round(done/tot*100)}%`;
    drawThumb($("#contCv"), im, true);
    cb.style.display = "";
    cb.onclick = () => { mode = s.mode; level = s.level||1; start(im, s); };
  } else cb.style.display = "none";
  const m = $("#modes"); m.innerHTML = "";
  MODES.forEach(md => {
    const b = document.createElement("button"); b.className = "mode";
    b.innerHTML = `<div class="ico">${md.ico}</div><b>${md.name}</b><small>${md.desc[p.level-1]}</small>`;
    if(p.lastMode===md.id) b.style.outline = "3px solid #ffc36b";
    b.onclick = () => { mode = md.id; level = p.level; p.lastMode = md.id; savePlayers(); say(md.name); show("pick"); };
    m.appendChild(b);
  });
}
$("#chgBtn").onclick = () => show("who");

function drawThumb(cv, image, colored){
  const W = image.rows[0].length, H = image.rows.length;
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"); ctx.clearRect(0,0,W,H);
  image.rows.forEach((row,y) => [...row].forEach((ch,x) => {
    if(ch===".") return;
    ctx.fillStyle = colored ? image.colors[ch] : "#d9d2c6";
    ctx.fillRect(x,y,1,1);
  }));
}

/* --- Scelta disegno --- */
function renderPick(){
  const p = me(); if(!p){ show("who"); return; }
  const md = modeById(mode);
  $("#pickTitle").textContent = md.ico + " " + md.name + " " + LEVELS[level-1].s + " – scegli un disegno";
  const box = $("#pics"); box.innerHTML = "";
  const groups = [
    {t:"🎄 Speciale Natale", cls:"sect xmas", list:IMAGES.filter(i => i.cat==="natale")},
    {t:"🎨 Disegni", cls:"sect", list:IMAGES.filter(i => i.cat!=="natale" && i.rows.length<=12)},
    {t:"🧩 Disegni grandi", cls:"sect", list:IMAGES.filter(i => i.cat!=="natale" && i.rows.length>12)}
  ];
  const holder = box.parentNode;
  holder.querySelectorAll(".sect, .pics.extra").forEach(e => e.remove());
  let target = box;
  groups.forEach((gr, gi) => {
    const hd = document.createElement("div"); hd.className = gr.cls; hd.textContent = gr.t;
    if(gi===0){ holder.insertBefore(hd, box); }
    else{ const nb = document.createElement("div"); nb.className = "pics extra"; holder.appendChild(hd); holder.appendChild(nb); target = nb; }
    gr.list.forEach(im => addPic(im, target, p));
  });
}
function addPic(im, box, p){
  {
    const st = p.stars[im.id] || 0;
    const b = document.createElement("button"); b.className = "pic";
    const cv = document.createElement("canvas"); drawThumb(cv, im, st>0);
    const s = document.createElement("span"); s.textContent = shortName(im);
    if(st){ const z = document.createElement("span"); z.className = "star"; z.textContent = " " + "★".repeat(st); s.appendChild(z); }
    b.append(cv, s);
    const W = im.rows[0].length;
    if(W>12){ const g = document.createElement("small"); g.textContent = W>=20 ? "gigante · " + W + "×" + W : "grande · " + W + "×" + W; b.appendChild(g); }
    b.onclick = () => start(im);
    box.appendChild(b);
  }
}

/* ---------- Gioco ---------- */
function sizeGrid(){
  if(!img) return;
  const W = img.rows[0].length, H = img.rows.length, N = Math.max(W,H);
  const vw = Math.min(window.innerWidth - 32, 820);
  const vh = window.innerHeight - (img.rows[0].length>12 ? 330 : 270);
  const side = Math.max(260, Math.min(vw, vh));
  const cell = Math.floor((side - 4 - (N-1)*2) / N);
  document.documentElement.style.setProperty("--cell", cell + "px");
  $("#zoomBox").style.display = N>12 ? "" : "none";
  resetZoom();
}

/* ---------- Zoom: due dita per ingrandire e spostarsi, un dito per colorare ---------- */
const view = $("#view");
let zs = 1, ztx = 0, zty = 0;
function applyZoom(){
  const W = grid.offsetWidth, H = grid.offsetHeight;
  zs = Math.min(4, Math.max(1, zs));
  ztx = Math.min(0, Math.max(W - W*zs, ztx));
  zty = Math.min(0, Math.max(H - H*zs, zty));
  grid.style.transform = `translate(${ztx}px, ${zty}px) scale(${zs})`;
}
function resetZoom(){ zs = 1; ztx = 0; zty = 0; applyZoom(); }
function zoomAt(f, cx, cy){
  const ns = Math.min(4, Math.max(1, zs*f));
  const px = (cx - ztx)/zs, py = (cy - zty)/zs;
  zs = ns; ztx = cx - px*zs; zty = cy - py*zs; applyZoom();
}
$("#zIn").onclick = e => { e.stopPropagation(); zoomAt(1.5, grid.offsetWidth/2, grid.offsetHeight/2); };
$("#zOut").onclick = e => { e.stopPropagation(); zoomAt(1/1.5, grid.offsetWidth/2, grid.offsetHeight/2); };
$("#zFit").onclick = e => { e.stopPropagation(); resetZoom(); };
["pointerdown","pointermove","pointerup"].forEach(t => $("#zoomBox").addEventListener(t, e => e.stopPropagation()));
document.addEventListener("gesturestart", e => e.preventDefault());
window.addEventListener("resize", sizeGrid);

function persist(){
  const p = me(); if(!p || !img) return;
  p.save = {mode, level, img:img.id, keys, order, sel, ts:Date.now(),
            labels: cells.map(c => c.lab || null), done: cells.map(c => c.done)};
  savePlayers();
}

function start(image, saved){
  img = image;
  const count = {}; img.rows.join("").split("").forEach(c => { if(c!==".") count[c]=(count[c]||0)+1; });
  colorIds = Object.keys(img.colors).sort((a,b)=>count[b]-count[a]);
  if(saved){ keys = saved.keys; order = saved.order; }
  else{ keys = makeKeys(mode, colorIds.length, level); order = shuffle(colorIds.map((_,i)=>i)); }
  const keyOf = {}; colorIds.forEach((c,i)=> keyOf[c] = order[i]);

  const g = $("#grid"); g.innerHTML = ""; g.style.gridTemplateColumns = "repeat(" + img.rows[0].length + ", var(--cell))";
  cells = []; remaining = keys.map(()=>0); total = 0; filled = 0;
  img.rows.forEach((row,y) => [...row].forEach((ch,x) => {
    const i = cells.length;
    const d = document.createElement("div"); d.className = "cell"; d.dataset.i = i;
    const c = {el:d, ch, k:-1, done:false, lab:null};
    if(ch==="."){ d.classList.add("bgc"); }
    else{
      c.k = keyOf[ch];
      c.lab = (saved && saved.labels[i]) || makeLabel(mode, keys[c.k], level);
      d.textContent = c.lab.t;
      if(c.lab.e) d.classList.add("emo");
      else if(c.lab.t.length>=5) d.classList.add("l5");
      else if(c.lab.t.length===4) d.classList.add("l4");
      remaining[c.k]++; total++;
    }
    cells.push(c); g.appendChild(d);
  }));

  const pal = $("#pal"); pal.innerHTML = "";
  keys.forEach((k,i) => {
    const col = img.colors[colorIds[order.indexOf(i)]];
    const b = document.createElement("button"); b.className = "sw" + (isLight(col) ? " light" : "");
    b.style.background = col; b.textContent = String(k); b.dataset.col = col;
    b.onclick = () => { select(i); persist(); say(typeof k==="number" ? NUMWORD[k] : k); };
    pal.appendChild(b);
  });

  // ripristina le caselle già colorate
  if(saved){
    cells.forEach((c,i) => {
      if(c.k>=0 && saved.done[i]){
        c.done = true; c.el.classList.add("done"); c.el.style.background = colorOfKey(c.k);
        filled++; remaining[c.k]--;
      }
    });
    remaining.forEach((r,i) => { if(r===0) pal.children[i].classList.add("ok"); });
  }

  $("#playTitle").textContent = modeById(mode).ico + " " + shortName(img) + " " + LEVELS[level-1].s;
  $("#helpBtn").style.display = level===3 ? "" : "none";
  $("#voiceBtn").textContent = voiceOn ? "🔊" : "🔇";
  $("#hint").textContent = level===3 ? "Livello difficile: niente caselle illuminate. Se serve, tocca 💡" : mode==="iniziali" ? "Tocca un disegnino per sentire la parola 👂" :
                           (mode==="somme"||mode==="sottrazioni") ? "Tocca una casella per sentire l'operazione 👂" :
                           "Scegli un colore qui sopra, poi tocca le caselle!";
  show("play"); sizeGrid(); hintOn = false;
  let s0 = saved && remaining[saved.sel]>0 ? saved.sel : remaining.findIndex(r => r>0);
  select(Math.max(0,s0)); updateProg(); persist();
}

function colorOfKey(i){ return $("#pal").children[i].dataset.col; }
let hintOn = false, hintTimer = null;
function select(i){
  sel = i;
  [...$("#pal").children].forEach((b,j) => b.classList.toggle("sel", j===i));
  const show = level<3 || hintOn;
  cells.forEach(c => c.el.classList.toggle("hi", show && !c.done && c.k===i));
}
$("#helpBtn").onclick = () => {
  hintOn = true; select(sel); say("Ecco dove colorare");
  clearTimeout(hintTimer); hintTimer = setTimeout(() => { hintOn = false; select(sel); }, 3000);
};
function fill(c){
  c.done = true; c.el.classList.remove("hi"); c.el.classList.add("done","pop");
  c.el.style.background = colorOfKey(c.k);
  filled++; remaining[c.k]--;
  beep(520 + (filled%5)*60, .12);
  if(remaining[c.k]===0){
    $("#pal").children[c.k].classList.add("ok");
    beep(880,.25,"triangle");
    const next = remaining.findIndex(r => r>0);
    const doneK = c.k;
    if(next>=0) setTimeout(()=>{ if(sel===doneK){ select(next); persist(); } }, 250);
  }
  updateProg();
  if(filled===total) setTimeout(win, 500); else persist();
}
function updateProg(){ $("#prog").textContent = Math.round(filled/total*100) + "%"; }

/* tocco e trascinamento (un dito colora, due dita zoomano) */
let painting = false, lastIdx = -1;
const touches = new Map(); let pinch = null;
function cellAt(x,y){
  const el = document.elementFromPoint(x,y);
  return el && el.classList && el.classList.contains("cell") ? cells[+el.dataset.i] : null;
}
function local(e){ const r = view.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
function startPinch(){
  const [a,b] = [...touches.values()];
  pinch = {d: Math.hypot(a.x-b.x, a.y-b.y) || 1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, s:zs, tx:ztx, ty:zty};
}
const grid = $("#grid");
view.addEventListener("pointerdown", e => {
  e.preventDefault();
  try{ view.setPointerCapture(e.pointerId); }catch(_){}
  touches.set(e.pointerId, local(e));
  if(touches.size===2){ painting = false; startPinch(); return; }
  if(touches.size>2) return;
  const c = cellAt(e.clientX, e.clientY); if(!c || c.k<0) return;
  painting = true; lastIdx = +c.el.dataset.i;
  if(c.done) return;
  if(c.lab && (mode==="iniziali"||mode==="somme"||mode==="sottrazioni")) say(c.lab.s);
  if(c.k===sel) fill(c);
  else{ c.el.classList.remove("bad"); void c.el.offsetWidth; c.el.classList.add("bad"); beep(180,.15,"square"); }
});
view.addEventListener("pointermove", e => {
  if(touches.has(e.pointerId)) touches.set(e.pointerId, local(e));
  if(pinch && touches.size>=2){
    const [a,b] = [...touches.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y) || 1, mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const ns = Math.min(4, Math.max(1, pinch.s * d / pinch.d));
    const px = (pinch.mx - pinch.tx)/pinch.s, py = (pinch.my - pinch.ty)/pinch.s;
    zs = ns; ztx = mx - px*ns; zty = my - py*ns; applyZoom();
    return;
  }
  if(!painting) return;
  const c = cellAt(e.clientX, e.clientY); if(!c) return;
  const idx = +c.el.dataset.i; if(idx===lastIdx) return; lastIdx = idx;
  if(!c.done && c.k===sel) fill(c);
});
const stop = e => {
  touches.delete(e.pointerId);
  if(touches.size<2) pinch = null;
  if(touches.size===0){ painting = false; lastIdx = -1; }
};
view.addEventListener("pointerup", stop); view.addEventListener("pointercancel", stop);

$("#playBack").onclick = () => { persist(); show("home"); };
$("#voiceBtn").onclick = () => { voiceOn = !voiceOn; store.set("cei-voice", voiceOn); $("#voiceBtn").textContent = voiceOn ? "🔊" : "🔇"; if(voiceOn) say("Voce accesa"); };
document.addEventListener("visibilitychange", () => { if(document.hidden && $("#play").classList.contains("on")) persist(); });

/* ---------- Vittoria ---------- */
function win(){
  const p = me();
  if(p){ p.stars[img.id] = Math.max(p.stars[img.id]||0, level); p.save = null; savePlayers(); }
  drawThumb($("#winCanvas"), img, true);
  $("#winStars").textContent = "★".repeat(level);
  $("#winTitle").textContent = p ? "Ben fatto, " + p.name + "!" : "Fantastico!";
  $("#win").classList.add("on");
  say(p ? "Fantastico " + p.name + "! Hai finito il disegno!" : "Fantastico! Hai finito il disegno!");
  [660,784,988,1318].forEach((f,i)=>setTimeout(()=>beep(f,.18,"triangle"), i*120));
  const em = ["🎉","⭐","🎈","🌈","✨","💖"];
  for(let i=0;i<28;i++){
    const s = document.createElement("div"); s.className = "conf"; s.textContent = pick(em);
    s.style.left = rnd(100) + "vw"; s.style.animationDuration = (1.8 + Math.random()*1.8) + "s";
    s.style.animationDelay = (Math.random()*.6) + "s";
    document.body.appendChild(s); setTimeout(()=>s.remove(), 4500);
  }
}
$("#nextBtn").onclick = () => {
  $("#win").classList.remove("on");
  const p = me(), st = p ? p.stars : {};
  const todo = IMAGES.filter(i => (st[i.id]||0) < level && i.id!==img.id);
  start(todo.length ? todo[0] : pick(IMAGES.filter(i=>i.id!==img.id)));
};
$("#homeBtn").onclick = () => { $("#win").classList.remove("on"); show("home"); };

/* ---------- Avvio ---------- */
if(me()) show("home");
else if(players.length) show("who");
else openNew();
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
